<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{TITLE}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    /* Client resets */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
    a { color: #5b50d6; }
    .btn-hover:hover { background: #4a40c4 !important; }

    /* Light mode (default) */
    .light-bg { background: #f6f6fb; }
    .light-card { background: #ffffff; border-color: rgba(20,20,40,0.10); }
    .light-text { color: #1f1f24; }
    .light-text-secondary { color: #5c5c66; }
    .light-text-tertiary { color: #9a9aa3; }
    .light-divider { background: rgba(20,20,40,0.10); }
    .light-accent { background: #5b50d6; color: #ffffff; }
    .light-accent-hover:hover { background: #4a40c4 !important; }
    .eyebrow { color: #5b50d6; }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f14 !important; }
      .light-bg { background: #0f0f14 !important; }
      .light-card { background: #16161d !important; border-color: rgba(255,255,255,0.13) !important; }
      .light-text { color: #e9e9f0 !important; }
      .light-text-secondary { color: #a6a6b3 !important; }
      .light-text-tertiary { color: #71717e !important; }
      .light-divider { background: rgba(255,255,255,0.13) !important; }
      .light-accent { background: #a79ef4 !important; color: #15151c !important; }
      .light-accent-hover:hover { background: #b6aef7 !important; }
      .eyebrow { color: #a79ef4 !important; }
      a { color: #a79ef4 !important; }
    }

    @media only screen and (max-width: 620px) {
      .container { width: 100% !important; }
      .px { padding-left: 24px !important; padding-right: 24px !important; }
      .h1 { font-size: 28px !important; line-height: 1.15 !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" class="light-bg">
  <!-- Preheader: hidden preview text shown in the inbox list -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; opacity:0;">
    {{PREHEADER}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="light-bg">
    <tr>
      <td align="center" style="padding:32px 16px;">

        <!-- Card -->
        <table role="presentation" class="container light-card" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; border:1px solid; border-radius:16px; overflow:hidden;">

          <!-- Accent bar -->
          <tr>
            <td style="height:4px; line-height:4px; font-size:4px; background:#8B83E8;">&nbsp;</td>
          </tr>

          <!-- Hero image (full width) -->
          <tr>
            <td style="padding:0; background:#f6f6fb;">
              <img src="{{HERO_URL}}" alt="{{TITLE}}" style="display:block; width:100%; height:auto; max-height:280px; object-fit:cover; background:#f6f6fb;">
            </td>
          </tr>

          <!-- Brand header with icon -->
          <tr>
            <td class="px" style="padding:28px 40px 8px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="width:44px; height:44px; text-align:center; vertical-align:middle;">
                    <img src="https://msharsha.com/icon-192.png" alt="MS" style="display:block; width:44px; height:44px; border-radius:8px;">
                  </td>
                  <td style="padding-left:12px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; letter-spacing:-0.01em;" class="light-text">
                    MS Harsha
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Eyebrow -->
          <tr>
            <td class="px" style="padding:20px 40px 0 40px;">
              <div class="eyebrow" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:#5b50d6;">
                New post
              </div>
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td class="px" style="padding:10px 40px 0 40px;">
              <h1 class="h1 light-text" style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:34px; line-height:1.1; font-weight:700; letter-spacing:-0.02em;">
                {{TITLE}}
              </h1>
            </td>
          </tr>

          <!-- Excerpt -->
          <tr>
            <td class="px" style="padding:18px 40px 0 40px;">
              <p class="light-text-secondary" style="margin:0; font-family:Georgia,'Times New Roman',serif; font-size:17px; line-height:1.6;">
                {{EXCERPT}}
              </p>
            </td>
          </tr>

          <!-- CTA button -->
          <tr>
            <td class="px" style="padding:28px 40px 8px 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="border-radius:10px;" class="light-accent">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{POST_URL}}" style="height:46px;v-text-anchor:middle;width:200px;" arcsize="22%" strokecolor="#5b50d6" fillcolor="#5b50d6">
                    <w:anchorlock/>
                    <center style="color:#ffffff;font-family:sans-serif;font-size:15px;font-weight:bold;">Read the post →</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-->
                    <a href="{{POST_URL}}" class="light-accent-hover" style="display:inline-block; padding:13px 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; text-decoration:none; border-radius:10px; background:#5b50d6; color:#ffffff;">
                      Read the post →
                    </a>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td class="px" style="padding:32px 40px 0 40px;">
              <div style="height:1px; line-height:1px; font-size:1px;" class="light-divider">&nbsp;</div>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="px" style="padding:24px 40px 32px 40px;">
              <p class="light-text-tertiary" style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; line-height:1.6;">
                You're receiving this because you subscribed at
                <a href="https://blog.msharsha.com" style="text-decoration:none;">blog.msharsha.com</a>.
              </p>
            </td>
          </tr>

        </table>
        <!-- /Card -->

      </td>
    </tr>
  </table>
  <div data-role="module-unsubscribe" class="module" role="module" data-type="unsubscribe" style="color:#444444; font-size:12px; line-height:20px; padding:16px 16px 16px 16px; text-align:Center;" data-muid="4e838cf3-9892-4a6d-94d6-170e474d21e5">

      <p style="font-size:12px; line-height:20px;">
          <a class="Unsubscribe--unsubscribeLink" href="{{{unsubscribe}}}" target="_blank" style="font-family:sans-serif;text-decoration:none;">
              Unsubscribe
          </a>
          -
          <a href="{{{unsubscribe_preferences}}}" target="_blank" class="Unsubscribe--unsubscribePreferences" style="font-family:sans-serif;text-decoration:none;">
              Unsubscribe Preferences
          </a>
      </p>
  </div>
</body>
</html>
